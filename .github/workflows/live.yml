# Verifica se a página da Livelo ainda é lida corretamente: falha quando a Livelo muda a
# estrutura da página ou o Akamai bloqueia a requisição. Roda semanalmente e quando muda o
# código que lê a página.
name: Live page

on:
  push:
    paths:
      - .github/workflows/live.yml
      - custom_components/livelo/api.py
      - custom_components/livelo/const.py
      - tests/test_live.py
      - requirements_test.txt
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # a mesma do Home Assistant 2026.x
      - run: pip install -r requirements_test.txt
      - run: pytest -m live
